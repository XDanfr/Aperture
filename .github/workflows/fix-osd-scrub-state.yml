name: Fix OSD scrub state

on:
  push:
    branches: [OSD2.0]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: OSD2.0
          fetch-depth: 0

      - name: Apply scrub state fixes
        run: python3 .github/scripts/fix_osd_scrub_state.py

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerViewModel.kt \
            app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerScreen.kt \
            .github/workflows/fix-osd-scrub-state.yml \
            .github/scripts/fix_osd_scrub_state.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix OSD scrub interaction state'
          git push origin OSD2.0
