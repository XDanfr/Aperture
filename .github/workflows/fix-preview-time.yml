name: Fix preview time styling

on:
  push:
    branches:
      - OSD2.0

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: OSD2.0
          fetch-depth: 0

      - name: Update preview time
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerScreen.kt')
          text = path.read_text(encoding='utf-8')

          pattern = r'''(?ms)                    Text\(\n                        text = formatTime\(seekPosition\),\n                        modifier = Modifier\.padding\(horizontal = 14\.dp, vertical = 10\.dp\),\n                        style = MaterialTheme\.typography\.[A-Za-z0-9_]+,\n                        color = MaterialTheme\.colorScheme\.onSurface\n                    \)'''
          replacement = '''                    Box(\n                        modifier = Modifier\n                            .fillMaxWidth()\n                            .padding(horizontal = 14.dp, vertical = 10.dp),\n                        contentAlignment = Alignment.Center\n                    ) {\n                        Text(\n                            text = formatTime(seekPosition),\n                            style = MaterialTheme.typography.titleLarge,\n                            color = MaterialTheme.colorScheme.onSurface\n                        )\n                    }'''

          new_text, count = re.subn(pattern, replacement, text, count=1)
          if count == 1:
              text = new_text
          elif 'text = formatTime(seekPosition)' not in text:
              raise SystemExit('Could not find preview time text block')

          # Restore the side elapsed/total readout if the earlier mistaken patch combined it.
          combined = '''                    Box(\n                        modifier = Modifier.fillMaxWidth().padding(top = 8.dp),\n                        contentAlignment = Alignment.Center\n                    ) {\n                        Text(\n                            text = "${formatTime(currentPosition)} / ${formatTime(duration)}",\n                            style = MaterialTheme.typography.titleLarge,\n                            color = Color.White\n                        )\n                    }'''
          side = '''                    Row(\n                        modifier = Modifier.fillMaxWidth().padding(top = 8.dp),\n                        horizontalArrangement = Arrangement.SpaceBetween\n                    ) {\n                        Text(formatTime(currentPosition), color = Color.White)\n                        Text(formatTime(duration), color = Color.White)\n                    }'''
          text = text.replace(combined, side, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change and remove workflow
        run: |
          rm -f .github/workflows/fix-preview-time.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerScreen.kt .github/workflows/fix-preview-time.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Centre preview scrub time'
          git pull --rebase origin OSD2.0
          git push origin OSD2.0
