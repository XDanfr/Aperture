name: Refine scrub focus

on:
  push:
    branches: [OSD2.0]

permissions:
  contents: write

concurrency:
  group: aperture-osd2-patch
  cancel-in-progress: false

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: OSD2.0
          fetch-depth: 0

      - name: Keep scrub controls in place and dim video
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerScreen.kt')
          s = p.read_text(encoding='utf-8')

          if 'import androidx.compose.ui.graphics.graphicsLayer' not in s:
              s = s.replace(
                  'import androidx.compose.ui.graphics.Color\n',
                  'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.graphicsLayer\n',
                  1,
              )

          state_anchor = '    var isScrubbing by remember { mutableStateOf(false) }\n'
          if state_anchor not in s:
              raise SystemExit('PlayerOsd scrub state not found')

          animation_state = '''\n    val scrubUiAlpha by androidx.compose.animation.core.animateFloatAsState(\n        targetValue = if (isScrubbing) 0f else 1f,\n        animationSpec = androidx.compose.animation.core.tween(220),\n        label = "scrubUiAlpha"\n    )\n    val scrubBackgroundAlpha by androidx.compose.animation.core.animateFloatAsState(\n        targetValue = if (isScrubbing) 0.76f else 0.5f,\n        animationSpec = androidx.compose.animation.core.tween(220),\n        label = "scrubBackgroundAlpha"\n    )\n'''
          if 'label = "scrubUiAlpha"' not in s:
              pos = s.index(state_anchor) + len(state_anchor)
              s = s[:pos] + animation_state + s[pos:]

          s = s.replace(
              '.background(Color.Black.copy(alpha = 0.5f))',
              '.background(Color.Black.copy(alpha = scrubBackgroundAlpha))',
              1,
          )

          old_title_open = '''            AnimatedVisibility(\n                visible = !isScrubbing,\n                enter = fadeIn(animationSpec = androidx.compose.animation.core.tween(220)) +\n                    slideInVertically(animationSpec = androidx.compose.animation.core.tween(220), initialOffsetY = { it / 5 }) +\n                    scaleIn(animationSpec = androidx.compose.animation.core.tween(220), initialScale = 0.96f),\n                exit = fadeOut(animationSpec = androidx.compose.animation.core.tween(160)) +\n                    slideOutVertically(animationSpec = androidx.compose.animation.core.tween(160), targetOffsetY = { -it / 5 }) +\n                    scaleOut(animationSpec = androidx.compose.animation.core.tween(160), targetScale = 0.96f)\n            ) {'''
          new_title_open = '''            Column(\n                modifier = Modifier.graphicsLayer {\n                    alpha = scrubUiAlpha\n                    val scale = 0.96f + (0.04f * scrubUiAlpha)\n                    scaleX = scale\n                    scaleY = scale\n                    translationY = -20f * (1f - scrubUiAlpha)\n                }\n            ) {'''
          if old_title_open in s:
              s = s.replace(old_title_open, new_title_open, 1)
          elif new_title_open not in s:
              raise SystemExit('Could not find title animation block')

          old_bottom_open = '''            AnimatedVisibility(\n                visible = !isScrubbing,\n                enter = fadeIn(animationSpec = androidx.compose.animation.core.tween(220)) +\n                    slideInVertically(animationSpec = androidx.compose.animation.core.tween(220), initialOffsetY = { it / 5 }) +\n                    scaleIn(animationSpec = androidx.compose.animation.core.tween(220), initialScale = 0.96f),\n                exit = fadeOut(animationSpec = androidx.compose.animation.core.tween(160)) +\n                    slideOutVertically(animationSpec = androidx.compose.animation.core.tween(160), targetOffsetY = { it / 5 }) +\n                    scaleOut(animationSpec = androidx.compose.animation.core.tween(160), targetScale = 0.96f)\n            ) {'''
          new_bottom_open = '''            Column(\n                modifier = Modifier.graphicsLayer {\n                    alpha = scrubUiAlpha\n                    val scale = 0.96f + (0.04f * scrubUiAlpha)\n                    scaleX = scale\n                    scaleY = scale\n                    translationY = 20f * (1f - scrubUiAlpha)\n                }\n            ) {'''
          if old_bottom_open in s:
              s = s.replace(old_bottom_open, new_bottom_open, 1)
          elif new_bottom_open not in s:
              raise SystemExit('Could not find bottom animation block')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit refined scrub focus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerScreen.kt .github/workflows/refine-scrub-focus.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Refine scrub focus and timeline positioning'
          git pull --rebase origin OSD2.0
          git push origin HEAD:OSD2.0

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/refine-scrub-focus.yml
          git commit -m 'Remove temporary scrub focus workflow'
          git pull --rebase origin OSD2.0
          git push origin HEAD:OSD2.0
