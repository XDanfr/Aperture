name: Fix Quick Menu Focus History

on:
  push:
    branches:
      - feature/expressive-quick-menu

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch focus history and category bounds
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/me/xdan/aperture/ui/screen/player/QuickMenuPages.kt')
          text = path.read_text()

          def replace(old, new, label, count=1):
              if text.count(old) != count:
                  raise SystemExit(f'{label}: expected {count}, found {text.count(old)}')
              return old

          text = text.replace(
              'import androidx.compose.runtime.mutableStateOf\n',
              'import androidx.compose.runtime.mutableIntStateOf\nimport androidx.compose.runtime.mutableStateOf\n',
              1,
          )
          text = text.replace(
              '    var page by remember { mutableStateOf<QuickMenuPage>(QuickMenuPage.Categories) }\n    val pageFocusRequester = remember { FocusRequester() }\n    val closeFocusRequester = remember { FocusRequester() }',
              '    var page by remember { mutableStateOf<QuickMenuPage>(QuickMenuPage.Categories) }\n    var selectedCategoryIndex by remember { mutableIntStateOf(0) }\n    val pageFocusRequester = remember { FocusRequester() }\n    val closeFocusRequester = remember { FocusRequester() }\n    val categoryFocusRequesters = remember {\n        List(quickMenuCategories.size) { FocusRequester() }\n    }',
              1,
          )
          text = text.replace(
              '    LaunchedEffect(page) {\n        withFrameNanos { }\n        withFrameNanos { }\n        if (page == QuickMenuPage.Categories) {\n            focusRequester.requestFocus()\n        } else {\n            pageFocusRequester.requestFocus()\n        }\n    }',
              '    LaunchedEffect(page, selectedCategoryIndex) {\n        withFrameNanos { }\n        withFrameNanos { }\n        if (page == QuickMenuPage.Categories) {\n            categoryFocusRequesters[selectedCategoryIndex]\n                .requestFocus()\n        } else {\n            pageFocusRequester.requestFocus()\n        }\n    }',
              1,
          )
          text = text.replace(
              '                    QuickMenuPage.Categories -> QuickMenuCategories(\n                        focusRequester = focusRequester,\n                        closeFocusRequester = closeFocusRequester,\n                        onSelected = { page = it }\n                    )',
              '                    QuickMenuPage.Categories -> QuickMenuCategories(\n                        focusRequester = focusRequester,\n                        closeFocusRequester = closeFocusRequester,\n                        categoryFocusRequesters = categoryFocusRequesters,\n                        selectedCategoryIndex = selectedCategoryIndex,\n                        onSelected = { index, selectedPage ->\n                            selectedCategoryIndex = index\n                            page = selectedPage\n                        }\n                    )',
              1,
          )
          text = text.replace(
              'private fun QuickMenuCategories(\n    focusRequester: FocusRequester,\n    closeFocusRequester: FocusRequester,\n    onSelected: (QuickMenuPage) -> Unit\n) {',
              'private fun QuickMenuCategories(\n    focusRequester: FocusRequester,\n    closeFocusRequester: FocusRequester,\n    categoryFocusRequesters: List<FocusRequester>,\n    selectedCategoryIndex: Int,\n    onSelected: (Int, QuickMenuPage) -> Unit\n) {',
              1,
          )
          old_category_surface = '''                Surface(\n                    onClick = { onSelected(category.page) },\n                    modifier = Modifier\n                        .weight(1f)\n                        .then(if (index == 0) Modifier.focusRequester(focusRequester) else Modifier)\n                        .focusProperties { up = closeFocusRequester },'''
          new_category_surface = '''                Surface(\n                    onClick = { onSelected(index, category.page) },\n                    modifier = Modifier\n                        .weight(1f)\n                        .focusRequester(categoryFocusRequesters[index])\n                        .focusProperties {\n                            up = closeFocusRequester\n                            left = if (index == 0) categoryFocusRequesters[index] else categoryFocusRequesters[index - 1]\n                            right = if (index == quickMenuCategories.lastIndex) categoryFocusRequesters[index] else categoryFocusRequesters[index + 1]\n                        },'''
          if text.count(old_category_surface) != 1:
              raise SystemExit('category surface block not found')
          text = text.replace(old_category_surface, new_category_surface, 1)

          # Preserve the existing external requester for the first category so PlayerScreen's
          # initial focus handoff remains valid, while the menu then owns category focus history.
          text = text.replace(
              '    val categoryFocusRequesters = remember {\n        List(quickMenuCategories.size) { FocusRequester() }\n    }',
              '    val categoryFocusRequesters = remember {\n        List(quickMenuCategories.size) { FocusRequester() }\n    }\n    LaunchedEffect(Unit) {\n        categoryFocusRequesters.first().requestFocus()\n    }',
              1,
          )
          text = text.replace(
              '                        .focusRequester(categoryFocusRequesters[index])',
              '                        .then(if (index == 0) Modifier.focusRequester(focusRequester) else Modifier.focusRequester(categoryFocusRequesters[index]))',
              1,
          )
          # Make the first category requester the same history target as the external requester.
          text = text.replace(
              '            categoryFocusRequesters[selectedCategoryIndex]\n                .requestFocus()',
              '            if (selectedCategoryIndex == 0) {\n                focusRequester.requestFocus()\n            } else {\n                categoryFocusRequesters[selectedCategoryIndex].requestFocus()\n            }',
              1,
          )

          path.write_text(text)
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/me/xdan/aperture/ui/screen/player/QuickMenuPages.kt
          if ! git diff --cached --quiet; then
            git commit -m "fix: preserve Quick Menu focus history"
          fi
          git rm .github/workflows/fix-quickmenu-focus-history.yml
          git commit -m "chore: remove temporary Quick Menu focus workflow"
          git push
