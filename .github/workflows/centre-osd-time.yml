name: Centre OSD time

on:
  push:
    branches: [OSD2.0]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: OSD2.0
          fetch-depth: 0
      - name: Centre timeline time text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerScreen.kt')
          s = p.read_text()

          old = '''                    Row(
                        modifier = Modifier.fillMaxWidth().padding(top = 8.dp),
                        horizontalArrangement = Arrangement.SpaceBetween
                    ) {
                        Text(formatTime(currentPosition), color = Color.White)
                        Text(formatTime(duration), color = Color.White)
                    }
'''

          new = '''                    Box(
                        modifier = Modifier.fillMaxWidth(),
                        contentAlignment = Alignment.Center
                    ) {
                        Text(
                            text = "${formatTime(currentPosition)} / ${formatTime(duration)}",
                            style = MaterialTheme.typography.titleLarge,
                            color = Color.White
                        )
                    }
'''

          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Could not find timeline time row')

          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerScreen.kt .github/workflows/centre-osd-time.yml
          if git diff --cached --quiet; then
            git restore .github/workflows/centre-osd-time.yml
            exit 0
          fi
          git commit -m 'Centre OSD timeline time'
          git pull --rebase origin OSD2.0
          git push origin OSD2.0
          rm -f .github/workflows/centre-osd-time.yml
      - name: Remove temporary workflow
        if: always()
        run: |
          if [ -f .github/workflows/centre-osd-time.yml ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows/centre-osd-time.yml
            git commit -m 'Remove temporary OSD time workflow' || true
            git pull --rebase origin OSD2.0 || true
            git push origin OSD2.0 || true
          fi
