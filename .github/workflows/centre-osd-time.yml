name: Centre OSD time

on:
  push:
    branches: [OSD2.0]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: OSD2.0
          fetch-depth: 0

      - name: Centre timeline time text
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerScreen.kt"); s=p.read_text(); old="""                    Row(\n                        modifier = Modifier.fillMaxWidth().padding(top = 8.dp),\n                        horizontalArrangement = Arrangement.SpaceBetween\n                    ) {\n                        Text(formatTime(currentPosition), color = Color.White)\n                        Text(formatTime(duration), color = Color.White)\n                    }\n"""; new="""                    Box(\n                        modifier = Modifier.fillMaxWidth().padding(top = 8.dp),\n                        contentAlignment = Alignment.Center\n                    ) {\n                        Text(\n                            text = \"${formatTime(currentPosition)} / ${formatTime(duration)}\",\n                            style = MaterialTheme.typography.titleLarge,\n                            color = Color.White\n                        )\n                    }\n"""; assert old in s or new in s; p.write_text(s.replace(old,new,1))'
          rm -f .github/workflows/centre-osd-time.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerScreen.kt .github/workflows/centre-osd-time.yml
          git commit -m 'Centre OSD timeline time'
          git pull --rebase origin OSD2.0
          git push origin OSD2.0
