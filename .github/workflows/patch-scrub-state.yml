name: Patch scrub state

on:
  push:
    branches: [OSD2.0]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix scrub state behaviour [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OSD2.0
        uses: actions/checkout@v4
        with:
          ref: OSD2.0
          fetch-depth: 1

      - name: Patch scrub state
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          vm = Path('app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerViewModel.kt')
          screen = Path('app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerScreen.kt')

          vm_text = vm.read_text()
          screen_text = screen.read_text()

          old = '''    private val playerListener = object : Player.Listener {
          override fun onPlayerError(error: PlaybackException) {'''
          new = '''    private val playerListener = object : Player.Listener {
          override fun onIsPlayingChanged(isPlaying: Boolean) {
              if (isPlaying) {
                  if (_isOsdVisible.value) resetOsdTimer()
              } else {
                  osdTimerJob?.cancel()
                  osdTimerJob = null
              }
          }

          override fun onPlayerError(error: PlaybackException) {'''
          if old not in vm_text:
              raise SystemExit('PlayerViewModel: playerListener anchor not found')
          vm_text = vm_text.replace(old, new, 1)

          old = '''    private fun resetOsdTimer() {
        osdTimerJob?.cancel()
        osdTimerJob = viewModelScope.launch { delay(3000); _isOsdVisible.value = false }
    }'''
          new = '''    private fun resetOsdTimer() {
        osdTimerJob?.cancel()
        if (!player.isPlaying) return

        osdTimerJob = viewModelScope.launch {
            delay(3000)
            if (player.isPlaying) {
                _isOsdVisible.value = false
            }
        }
    }'''
          if old not in vm_text:
              raise SystemExit('PlayerViewModel: resetOsdTimer exact body not found')
          vm_text = vm_text.replace(old, new, 1)

          vm.write_text(vm_text)

          old = '''                            KeyEvent.KEYCODE_DPAD_CENTER,
                            KeyEvent.KEYCODE_ENTER -> {
                                endHold()

                                if (scrubbing) {
                                    commitScrubbing()
                                } else {
                                    beginScrubbing()
                                }

                                true
                            }

                            KeyEvent.KEYCODE_BACK -> {
                                if (scrubbing) {
                                    cancelScrubbing()
                                    true
                                } else {
                                    false
                                }
                            }

                            else -> false'''
          new = '''                            KeyEvent.KEYCODE_DPAD_CENTER,
                            KeyEvent.KEYCODE_ENTER -> {
                                endHold()

                                if (scrubbing) {
                                    commitScrubbing()
                                } else if (player.isPlaying) {
                                    player.pause()
                                } else {
                                    player.play()
                                }

                                true
                            }

                            KeyEvent.KEYCODE_BACK -> {
                                if (scrubbing) {
                                    cancelScrubbing()
                                    onScrubToControls()
                                    true
                                } else {
                                    false
                                }
                            }

                            KeyEvent.KEYCODE_DPAD_UP -> {
                                if (scrubbing) {
                                    endHold()
                                    cancelScrubbing()
                                    onScrubUp()
                                    true
                                } else {
                                    false
                                }
                            }

                            KeyEvent.KEYCODE_DPAD_DOWN -> {
                                if (scrubbing) {
                                    endHold()
                                    cancelScrubbing()
                                    onScrubToControls()
                                    true
                                } else {
                                    false
                                }
                            }

                            else -> false'''
          if old not in screen_text:
              raise SystemExit('PlayerScreen: scrub key handler block not found')
          screen_text = screen_text.replace(old, new, 1)

          old = '''    BoxWithConstraints(
        modifier = modifier'''
          new = '''    androidx.activity.compose.BackHandler(enabled = scrubbing) {
        endHold()
        cancelScrubbing()
        onScrubToControls()
    }

    BoxWithConstraints(
        modifier = modifier'''
          if old not in screen_text:
              raise SystemExit('PlayerScreen: BoxWithConstraints anchor not found')
          screen_text = screen_text.replace(old, new, 1)

          old = '''        onScrubbingChanged(false)

        // Seeking is an explicit action, so resume playback on commit.
        player.play()
    }

    fun cancelScrubbing() {'''
          new = '''        onScrubbingChanged(false)

        // Seeking is an explicit action, so resume playback on commit.
        player.play()
    }

    fun cancelScrubbing() {'''
          if old not in screen_text:
              raise SystemExit('PlayerScreen: commitScrubbing anchor not found')

          old = '''        onScrubbingChanged(false)

        if (wasPlayingBeforeScrub) {
            player.play()
        }
    }'''
          new = '''        onScrubbingChanged(false)

        player.play()
    }'''
          if old not in screen_text:
              raise SystemExit('PlayerScreen: cancelScrubbing body not found')
          screen_text = screen_text.replace(old, new, 1)

          screen.write_text(screen_text)

          workflow = Path('.github/workflows/patch-scrub-state.yml')
          workflow.unlink()
          print('scrub state patch applied')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerViewModel.kt app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerScreen.kt .github/workflows/patch-scrub-state.yml
          git commit -m 'Fix scrub state behaviour [skip ci]'
          git push origin HEAD:OSD2.0
