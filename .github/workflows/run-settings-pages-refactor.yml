name: Refactor settings into pages

on:
  push:
    branches: [settingsPages]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ github.event.head_commit.message == 'Trigger settings pages refactor' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: settingsPages
          fetch-depth: 0

      - name: Refactor settings screen
        run: python3 .github/scripts/refactor_settings_pages.py

      - name: Commit refactor and clean up automation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/me/xdan/aperture/ui/screen/settings/SettingsScreen.kt
          git commit -m 'Refactor settings into pages'
          git rm .github/scripts/refactor_settings_pages.py .github/workflows/run-settings-pages-refactor.yml .github/workflows/refactor-settings-pages.yml .github/settings-pages-trigger
          git commit -m 'Remove temporary settings refactor automation'
          git push origin settingsPages
