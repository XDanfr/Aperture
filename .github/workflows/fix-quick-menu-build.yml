name: Patch Quick Menu Build Errors

on:
  push:
    paths:
      - '.github/workflows/fix-quick-menu-build.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/expressive-quick-menu
          fetch-depth: 0

      - name: Patch QuickMenuPages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/me/xdan/aperture/ui/screen/player/QuickMenuPages.kt')
          text = path.read_text()

          old_colors = '''        colors = ClickableSurfaceDefaults.colors(\n            containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.97f)\n        )'''
          new_colors = '''        colors = androidx.tv.material3.SurfaceDefaults.colors(\n            containerColor = MaterialTheme.colorScheme.surface.copy(alpha = 0.97f)\n        )'''
          if old_colors not in text:
              raise SystemExit('Expected QuickMenu surface colors block was not found')
          text = text.replace(old_colors, new_colors, 1)

          marker = '''@OptIn(ExperimentalTvMaterial3Api::class)\n@Composable\nprivate fun QuickMenuSubtitlesPage('''
          helper = '''@OptIn(ExperimentalTvMaterial3Api::class)\n@Composable\nprivate fun QuickMenuTimingAdjustmentControl(\n    label: String,\n    valueMs: Long,\n    supportingText: String,\n    focusRequester: FocusRequester,\n    onDecrease: () -> Unit,\n    onIncrease: () -> Unit,\n    onReset: () -> Unit\n) {\n    Column(verticalArrangement = Arrangement.spacedBy(6.dp)) {\n        Text(label, style = MaterialTheme.typography.labelLarge)\n        Row(\n            horizontalArrangement = Arrangement.spacedBy(6.dp),\n            verticalAlignment = Alignment.CenterVertically\n        ) {\n            QuickMenuAction(\n                label = "−",\n                icon = Icons.Rounded.FastRewind,\n                onClick = onDecrease,\n                focusRequester = focusRequester\n            )\n            Surface(\n                onClick = onReset,\n                modifier = Modifier.weight(1f),\n                shape = ClickableSurfaceDefaults.shape(RoundedCornerShape(18.dp)),\n                colors = ClickableSurfaceDefaults.colors(\n                    containerColor = MaterialTheme.colorScheme.surfaceVariant\n                )\n            ) {\n                Text(formatQuickMenuDelay(valueMs), modifier = Modifier.padding(12.dp))\n            }\n            QuickMenuAction(\n                label = "+",\n                icon = Icons.Rounded.FastForward,\n                onClick = onIncrease\n            )\n        }\n        Text(\n            supportingText,\n            style = MaterialTheme.typography.bodySmall,\n            color = MaterialTheme.colorScheme.onSurfaceVariant\n        )\n    }\n}\n\nprivate fun formatQuickMenuDelay(delayMs: Long): String = when {\n    delayMs == 0L -> "0 ms"\n    kotlin.math.abs(delayMs) < 1_000L -> String.format(Locale.getDefault(), "%+d ms", delayMs)\n    else -> String.format(Locale.getDefault(), "%+.1f s", delayMs / 1_000f)\n}\n\n'''
          if 'private fun QuickMenuTimingAdjustmentControl(' not in text:
              if marker not in text:
                  raise SystemExit('Subtitle page marker was not found')
              text = text.replace(marker, helper + marker, 1)

          text = text.replace('''        TimingAdjustmentControl(\n''', '''        QuickMenuTimingAdjustmentControl(\n''', 1)
          path.write_text(text)
          PY

      - name: Commit patched file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/me/xdan/aperture/ui/screen/player/QuickMenuPages.kt
          git commit -m 'fix: resolve quick menu compile errors' || exit 0
          git push origin feature/expressive-quick-menu

      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-quick-menu-build.yml
          git add .github/workflows/fix-quick-menu-build.yml
          git commit -m 'chore: remove temporary quick menu patch workflow' || exit 0
          git push origin feature/expressive-quick-menu
