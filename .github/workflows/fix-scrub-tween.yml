name: Fix scrub animation tween

on:
  push:
    branches: [OSD2.0]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: OSD2.0
          fetch-depth: 0
      - name: Qualify tween calls and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerScreen.kt')
          s = p.read_text()
          s = s.replace('animationSpec = tween(', 'animationSpec = androidx.compose.animation.core.tween(')
          p.write_text(s)
          w = Path('.github/workflows/fix-scrub-tween.yml')
          w.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/me/xdan/aperture/ui/screen/player/PlayerScreen.kt .github/workflows/fix-scrub-tween.yml
          git commit -m 'Fix scrub animation tween references'
          git push origin OSD2.0
