name: Fix settings page headers

on:
  push:
    branches: [settingsPages]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message == 'Trigger settings page header fix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: settingsPages
          fetch-depth: 0
      - name: Fix page headers
        run: python3 .github/scripts/fix_settings_page_headers.py
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/me/xdan/aperture/ui/screen/settings/SettingsScreen.kt
          git commit -m 'Fix settings page header composition'
          git rm .github/scripts/fix_settings_page_headers.py .github/workflows/fix-settings-page-headers.yml .github/settings-page-header-trigger
          git commit -m 'Remove temporary settings page header automation'
          git push origin settingsPages
