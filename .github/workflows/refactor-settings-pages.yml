name: Refactor settings into pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: settingsPages
          fetch-depth: 0

      - name: Refactor SettingsScreen
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/me/xdan/aperture/ui/screen/settings/SettingsScreen.kt')
          text = path.read_text()

          if 'private enum class SettingsPage' not in text:
              anchor = 'private const val SETTINGS_THEME_FOCUS_KEY = "theme"'
              if anchor not in text:
                  raise SystemExit('settings constants anchor not found')
              enum_block = '''private enum class SettingsPage {\n    OVERVIEW,\n    CUSTOMISATION,\n    LIBRARY,\n    PLAYBACK,\n    ABOUT\n}\n\n'''
              text = text.replace(anchor, enum_block + anchor, 1)

          state_anchor = '    val donateFocusRequester = if (restoreFocusKey == SETTINGS_DONATE_FOCUS_KEY) {\n'
          if 'var currentPage by remember' not in text:
              state = '''    var currentPage by remember(restoreFocusKey) {\n        mutableStateOf(\n            when (restoreFocusKey) {\n                SETTINGS_THEME_FOCUS_KEY, SETTINGS_AMBIENT_FOCUS_KEY,\n                SETTINGS_SHOW_LAYOUT_FOCUS_KEY, SETTINGS_ROUNDED_SPOTLIGHT_FOCUS_KEY,\n                SETTINGS_SPOTLIGHT_TOGGLE_FOCUS_KEY, SETTINGS_SPOTLIGHT_DAYS_FOCUS_KEY -> SettingsPage.CUSTOMISATION\n                SETTINGS_HIDDEN_FOCUS_KEY, SETTINGS_MEDIA_FOLDERS_FOCUS_KEY,\n                SETTINGS_RESCAN_FOCUS_KEY, SETTINGS_CLEAR_CACHE_FOCUS_KEY -> SettingsPage.LIBRARY\n                SETTINGS_OPEN_SUBTITLES_FOCUS_KEY, SETTINGS_SUBTITLES_FOCUS_KEY -> SettingsPage.PLAYBACK\n                SETTINGS_LICENCES_FOCUS_KEY, SETTINGS_UPDATE_FOCUS_KEY,\n                SETTINGS_TMDB_FOCUS_KEY, SETTINGS_DONATE_FOCUS_KEY -> SettingsPage.ABOUT\n                else -> SettingsPage.OVERVIEW\n            }\n        )\n    }\n\n'''
              text = text.replace(state_anchor, state + state_anchor, 1)

          # Drop the old absolute list-index restoration, since pages each have their own shorter list.
          rs = text.find('    LaunchedEffect(Unit) {\n        val restoreIndex = when (restoreFocusKey) {')
          if rs >= 0:
              re = text.find('    }\n\n    Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.TopCenter) {', rs)
              if re < 0:
                  raise SystemExit('restore effect end not found')
              text = text[:rs] + text[re + 6:]

          # Replace only the LazyColumn content lambda.
          lazy = text.find('            LazyColumn(\n                state = listState,')
          if lazy < 0:
              raise SystemExit('LazyColumn not found')
          open_brace = text.find('            ) {\n', lazy)
          if open_brace < 0:
              raise SystemExit('LazyColumn opening not found')
          body_start = open_brace + len('            ) {\n')
          depth = 1
          pos = body_start
          while pos < len(text) and depth:
              if text[pos] == '{': depth += 1
              elif text[pos] == '}': depth -= 1
              pos += 1
          if depth:
              raise SystemExit('LazyColumn closing brace not found')
          body_end = pos - 1
          body = text[body_start:body_end]

          headers = [
              ('Customisation', 'Theme, presentation and ambient mode', 'CUSTOMISATION'),
              ('Library & storage', 'Folders, hidden titles and library maintenance', 'LIBRARY'),
              ('Playback & subtitles', 'Subtitle account and on-screen appearance', 'PLAYBACK'),
              ('About Aperture', 'Updates, licences and project information', 'ABOUT'),
          ]
          found = []
          for title, description, enum in headers:
              marker = f'            item {{\n                SettingsCategoryHeader(\n                    title = "{title}"'
              idx = body.find(marker)
              if idx < 0:
                  raise SystemExit(f'category not found: {title}')
              found.append((idx, title, description, enum))
          found.sort()

          groups = {}
          for i, (start, title, description, enum) in enumerate(found):
              end = found[i + 1][0] if i + 1 < len(found) else len(body)
              chunk = body[start:end]
              # Remove the category-header item itself.
              first_open = chunk.find('{')
              d = 1
              j = first_open + 1
              while j < len(chunk) and d:
                  if chunk[j] == '{': d += 1
                  elif chunk[j] == '}': d -= 1
                  j += 1
              if d:
                  raise SystemExit(f'category header block malformed: {title}')
              groups[enum] = chunk[j:]

          overview = '''            item {\n                SettingsPageHeader(\n                    title = "Settings",\n                    description = "Choose a settings area"\n                )\n            }\n            item {\n                SettingsItem(\n                    title = "Customisation",\n                    subtitle = "Theme, presentation and ambient mode",\n                    icon = Icons.Rounded.Palette,\n                    drawerFocusRequester = drawerFocusRequester,\n                    onFocused = { requester -> onContentFocused(requester) },\n                    onClick = { currentPage = SettingsPage.CUSTOMISATION }\n                )\n            }\n            item {\n                SettingsItem(\n                    title = "Library & storage",\n                    subtitle = "Folders, hidden titles and library maintenance",\n                    icon = Icons.Rounded.FolderOpen,\n                    drawerFocusRequester = drawerFocusRequester,\n                    onFocused = { requester -> onContentFocused(requester) },\n                    onClick = { currentPage = SettingsPage.LIBRARY }\n                )\n            }\n            item {\n                SettingsItem(\n                    title = "Playback & subtitles",\n                    subtitle = "Playback, subtitles and related options",\n                    icon = Icons.Rounded.Subtitles,\n                    drawerFocusRequester = drawerFocusRequester,\n                    onFocused = { requester -> onContentFocused(requester) },\n                    onClick = { currentPage = SettingsPage.PLAYBACK }\n                )\n            }\n            item {\n                SettingsItem(\n                    title = "About Aperture",\n                    subtitle = "Updates, licences and project information",\n                    icon = Icons.Rounded.Info,\n                    drawerFocusRequester = drawerFocusRequester,\n                    onFocused = { requester -> onContentFocused(requester) },\n                    onClick = { currentPage = SettingsPage.ABOUT }\n                )\n            }\n'''

          page_header = {\n              'CUSTOMISATION': ('Customisation', 'Theme, presentation and ambient mode'),\n              'LIBRARY': ('Library & storage', 'Folders, hidden titles and library maintenance'),\n              'PLAYBACK': ('Playback & subtitles', 'Subtitle account and on-screen appearance'),\n              'ABOUT': ('About Aperture', 'Updates, licences and project information'),\n          }

          branches = []
          branches.append('''                SettingsPage.OVERVIEW -> {\n%s                }''' % overview)
          for enum in ['CUSTOMISATION', 'LIBRARY', 'PLAYBACK', 'ABOUT']:
              title, description = page_header[enum]
              branches.append('''                SettingsPage.%s -> {\n                    item {\n                        SettingsPageHeader(\n                            title = "%s",\n                            description = "%s",\n                            onBack = { currentPage = SettingsPage.OVERVIEW }\n                        )\n                    }\n%s                }''' % (enum, title, description, groups[enum]))

          new_body = '''            when (currentPage) {\n%s\n            }\n''' % '\n'.join(branches)
          text = text[:body_start] + new_body + text[body_end:]

          # Replace the disabled placeholder language row with a disabled shared Languages row on the Playback page.
          old_language = '''            item {\n                SettingsItem(\n                    title = "Language",\n                    subtitle = "English (system default) · More options coming soon",\n                    icon = Icons.Rounded.Language,\n                    enabled = false,\n                    drawerFocusRequester = drawerFocusRequester,\n                    onFocused = { requester ->\n                        onFocusKeyChanged(SETTINGS_LANGUAGE_FOCUS_KEY)\n                        onContentFocused(requester)\n                    },\n                    onClick = {}\n                )\n            }\n\n'''
          new_language = '''            item {\n                SettingsItem(\n                    title = "Languages",\n                    subtitle = "Audio and subtitle language preferences · Coming later",\n                    icon = Icons.Rounded.Language,\n                    enabled = false,\n                    drawerFocusRequester = drawerFocusRequester,\n                    onFocused = { requester -> onContentFocused(requester) },\n                    onClick = {}\n                )\n            }\n\n'''
          if old_language in text:
              text = text.replace(old_language, '', 1)
              # Insert at the beginning of Playback branch, after its header item.
              playback_anchor = '''                SettingsPage.PLAYBACK -> {\n                    item {\n                        SettingsPageHeader(\n                            title = "Playback & subtitles",\n                            description = "Subtitle account and on-screen appearance",\n                            onBack = { currentPage = SettingsPage.OVERVIEW }\n                        )\n                    }\n'''
              if playback_anchor not in text:
                  raise SystemExit('Playback branch anchor not found')
              text = text.replace(playback_anchor, playback_anchor + new_language, 1)

          # Add ArrowBack import if missing and add SettingsPageHeader helper.
          if 'import androidx.compose.material.icons.rounded.ArrowBack' not in text:
              import_anchor = 'import androidx.compose.material.icons.rounded.DeleteSweep\n'
              if import_anchor not in text:
                  raise SystemExit('import anchor not found')
              text = text.replace(import_anchor, import_anchor + 'import androidx.compose.material.icons.rounded.ArrowBack\n', 1)

          if 'private fun SettingsPageHeader(' not in text:
              helper_anchor = '@Composable\nprivate fun SettingsItem('
              if helper_anchor not in text:
                  raise SystemExit('SettingsItem helper anchor not found')
              helper = '''@Composable\nprivate fun SettingsPageHeader(\n    title: String,\n    description: String,\n    onBack: (() -> Unit)? = null\n) {\n    Column(\n        modifier = Modifier\n            .fillMaxWidth()\n            .padding(top = 28.dp, bottom = 4.dp),\n        verticalArrangement = Arrangement.spacedBy(8.dp)\n    ) {\n        if (onBack != null) {\n            Surface(\n                onClick = onBack,\n                shape = ClickableSurfaceDefaults.shape(RoundedCornerShape(18.dp)),\n                colors = ClickableSurfaceDefaults.colors(\n                    containerColor = Color.Transparent,\n                    focusedContainerColor = MaterialTheme.colorScheme.secondaryContainer\n                )\n            ) {\n                Row(\n                    modifier = Modifier.padding(horizontal = 14.dp, vertical = 8.dp),\n                    verticalAlignment = Alignment.CenterVertically\n                ) {\n                    Icon(Icons.Rounded.ArrowBack, contentDescription = null, modifier = Modifier.size(18.dp))\n                    Spacer(Modifier.width(8.dp))\n                    Text("Back to Settings")\n                }\n            }\n        }\n        Text(title, style = MaterialTheme.typography.headlineMedium)\n        Text(\n            description,\n            style = MaterialTheme.typography.bodyLarge,\n            color = MaterialTheme.colorScheme.onSurfaceVariant\n        )\n    }\n}\n\n'''
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          path.write_text(text)
          PY

      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/me/xdan/aperture/ui/screen/settings/SettingsScreen.kt .github/workflows/refactor-settings-pages.yml
          git commit -m 'Refactor settings into pages'
          git rm .github/workflows/refactor-settings-pages.yml
          git commit -m 'Remove temporary settings refactor workflow'
          git push origin settingsPages
