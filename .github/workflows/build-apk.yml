name: Build signed APKs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional: create (or update) this draft release, tagging the selected commit'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: signed-apks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        run: |
          sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Prepare API keys
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:').replace(' ', '\\ ')
          keys = ['TMDB_API_KEY', 'OPENSUBTITLES_API_KEY']
          for key in keys:
              if not os.environ.get(key):
                  raise SystemExit(f'Missing repository secret: {key}')
          Path('local.properties').write_text(''.join(f'{key}={escape(os.environ[key])}\n' for key in keys))
          PY

      - name: Build release variants
        run: bash ./gradlew --no-daemon :app:assembleStandardRelease :app:assembleCreatorRelease :mobile:assembleRelease

      - name: Sign and verify APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          umask 077
          keystore="$RUNNER_TEMP/aperture-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          mkdir -p signed-apks
          tools="$ANDROID_HOME/build-tools/37.0.0"
          # name|unsigned source: the TV variants plus the phone companion.
          for entry in \
            "standard|app/build/outputs/apk/standard/release/app-standard-release-unsigned.apk" \
            "creator|app/build/outputs/apk/creator/release/app-creator-release-unsigned.apk" \
            "companion|mobile/build/outputs/apk/release/mobile-release-unsigned.apk"; do
            variant="${entry%%|*}"
            source="${entry#*|}"
            aligned="$RUNNER_TEMP/aperture-$variant-aligned.apk"
            output="signed-apks/Aperture-$variant-release.apk"
            test -f "$source"
            "$tools/zipalign" -P 16 -f 4 "$source" "$aligned"
            "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
              --out "$output" "$aligned"
            "$tools/apksigner" verify --verbose "$output"
            "$tools/zipalign" -c -P 16 4 "$output"
            rm -f "$aligned"
          done
          cd signed-apks
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: Aperture-signed-apks-${{ github.run_number }}
          path: |
            signed-apks/*.apk
            signed-apks/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # On a tag, attach the signed APKs to the draft release (notes from docs/releases/<tag>.md).
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          notes="docs/releases/$TAG.md"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            [ -f "$notes" ] && gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file "$notes"
          elif [ -f "$notes" ]; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --prerelease --target "$GITHUB_SHA" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --prerelease --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber signed-apks/*.apk signed-apks/SHA256SUMS.txt

      - name: Clean up private build inputs
        if: always()
        run: rm -f local.properties "$RUNNER_TEMP/aperture-release.jks"
