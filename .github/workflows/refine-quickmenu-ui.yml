name: Refine Quick Menu UI

on:
  push:
    branches:
      - feature/expressive-quick-menu

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Quick Menu UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = Path('app/src/main/java/me/xdan/aperture/ui/screen/player/QuickMenuPages.kt')
          text = pages.read_text()

          def replace(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'missing expected block: {label}')
              text = text.replace(old, new, 1)

          def replace_regex(pattern, new, label):
              global text
              updated, count = re.subn(pattern, new, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'missing expected regex block: {label}')
              text = updated

          replace(
              'import androidx.compose.foundation.lazy.LazyColumn\n',
              'import androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.grid.GridCells\nimport androidx.compose.foundation.lazy.grid.LazyVerticalGrid\n',
              'grid imports'
          )

          replace_regex(
              r'@OptIn\(ExperimentalTvMaterial3Api::class\)\n@Composable\nprivate fun QuickMenuTrackPage\(.*?\n\}\n\n@OptIn\(ExperimentalTvMaterial3Api::class\)\n@Composable\nprivate fun QuickMenuTimingAdjustmentControl',
              '''@OptIn(ExperimentalTvMaterial3Api::class)
@Composable
private fun QuickMenuTrackPage(
    title: String,
    type: Int,
    player: androidx.media3.common.Player,
    firstFocusRequester: FocusRequester,
    emptyLabel: String,
    headerContent: (@Composable () -> Unit)? = null
) {
    var tracks by remember(player) { mutableStateOf(player.currentTracks) }

    androidx.compose.runtime.DisposableEffect(player) {
        val listener = object : androidx.media3.common.Player.Listener {
            override fun onTracksChanged(newTracks: Tracks) {
                tracks = newTracks
            }
        }
        player.addListener(listener)
        onDispose { player.removeListener(listener) }
    }

    val items = getQuickMenuTrackItems(tracks, type).filter { it.isSupported }
    val selectedItem = items.firstOrNull { it.isSelected }

    Column(
        modifier = Modifier
            .fillMaxSize()
            .padding(28.dp),
        verticalArrangement = Arrangement.spacedBy(16.dp)
    ) {
        Text(title, style = MaterialTheme.typography.headlineMedium)

        if (items.isEmpty()) {
            Text(
                emptyLabel,
                color = MaterialTheme.colorScheme.onSurfaceVariant,
                style = MaterialTheme.typography.bodyLarge
            )
            return
        }

        Text(
            "Selected: ${selectedItem?.name ?: "None"}",
            style = MaterialTheme.typography.bodyLarge,
            color = MaterialTheme.colorScheme.onSurfaceVariant
        )

        headerContent?.invoke()

        LazyVerticalGrid(
            columns = GridCells.Fixed(3),
            modifier = Modifier
                .fillMaxSize()
                .padding(horizontal = 8.dp),
            verticalArrangement = Arrangement.spacedBy(12.dp),
            horizontalArrangement = Arrangement.spacedBy(12.dp)
        ) {
            items(items, key = { "${it.group.mediaTrackGroup.id}-${it.index}" }) { item ->
                Surface(
                    onClick = {
                        player.trackSelectionParameters = player.trackSelectionParameters
                            .buildUpon()
                            .setTrackTypeDisabled(type, false)
                            .setOverrideForType(
                                TrackSelectionOverride(item.group.mediaTrackGroup, item.index)
                            )
                            .build()
                    },
                    modifier = Modifier.then(
                        if (item == items.firstOrNull()) {
                            Modifier.focusRequester(firstFocusRequester)
                        } else {
                            Modifier
                        }
                    ),
                    shape = ClickableSurfaceDefaults.shape(RoundedCornerShape(18.dp)),
                    colors = ClickableSurfaceDefaults.colors(
                        containerColor = if (item.isSelected) {
                            MaterialTheme.colorScheme.secondaryContainer
                        } else {
                            MaterialTheme.colorScheme.surfaceVariant
                        }
                    )
                ) {
                    Text(
                        item.name,
                        modifier = Modifier.padding(18.dp),
                        maxLines = 2
                    )
                }
            }
        }
    }
}

@OptIn(ExperimentalTvMaterial3Api::class)
@Composable
private fun QuickMenuTimingAdjustmentControl''',
              'track page grid'
          )

          replace_regex(
              r'@OptIn\(ExperimentalTvMaterial3Api::class\)\n@Composable\nprivate fun QuickMenuSubtitlesPage\(.*?\n\}\n\n@OptIn\(ExperimentalTvMaterial3Api::class\)\n@Composable\nprivate fun QuickMenuPlaybackPage',
              '''@OptIn(ExperimentalTvMaterial3Api::class)
@Composable
private fun QuickMenuSubtitlesPage(
    player: androidx.media3.common.Player,
    firstFocusRequester: FocusRequester,
    subtitleDelayMs: Long,
    onSubtitleDelayDecrease: () -> Unit,
    onSubtitleDelayIncrease: () -> Unit,
    onSubtitleDelayReset: () -> Unit
) {
    val trackFocusRequester = remember { FocusRequester() }

    Column(
        modifier = Modifier
            .fillMaxSize()
            .padding(28.dp),
        verticalArrangement = Arrangement.spacedBy(16.dp)
    ) {
        QuickMenuTrackPage(
            title = "Subtitles",
            type = C.TRACK_TYPE_TEXT,
            player = player,
            firstFocusRequester = trackFocusRequester,
            emptyLabel = "No subtitle tracks available.",
            headerContent = {
                QuickMenuTimingAdjustmentControl(
                    label = "Subtitle sync",
                    valueMs = subtitleDelayMs,
                    supportingText = "Negative values show subtitles earlier",
                    onDecrease = onSubtitleDelayDecrease,
                    onIncrease = onSubtitleDelayIncrease,
                    onReset = onSubtitleDelayReset,
                    focusRequester = firstFocusRequester
                )
            }
        )
    }
}

@OptIn(ExperimentalTvMaterial3Api::class)
@Composable
private fun QuickMenuPlaybackPage''',
              'subtitle empty state and layout'
          )

          replace_regex(
              r'@OptIn\(ExperimentalTvMaterial3Api::class\)\n@Composable\nprivate fun QuickMenuPlaybackPage\(.*?\n\}\n\n@OptIn\(ExperimentalTvMaterial3Api::class\)\n@Composable\nprivate fun QuickMenuVideoPage',
              '''@OptIn(ExperimentalTvMaterial3Api::class)
@Composable
private fun QuickMenuPlaybackPage(
    player: androidx.media3.common.Player,
    firstFocusRequester: FocusRequester
) {
    var isPlaying by remember(player) { mutableStateOf(player.isPlaying) }

    androidx.compose.runtime.DisposableEffect(player) {
        val listener = object : androidx.media3.common.Player.Listener {
            override fun onIsPlayingChanged(playing: Boolean) { isPlaying = playing }
        }
        player.addListener(listener)
        onDispose { player.removeListener(listener) }
    }

    LazyVerticalGrid(
        columns = GridCells.Fixed(3),
        modifier = Modifier
            .fillMaxSize()
            .padding(28.dp),
        verticalArrangement = Arrangement.spacedBy(12.dp),
        horizontalArrangement = Arrangement.spacedBy(12.dp)
    ) {
        item(span = { androidx.compose.foundation.lazy.grid.GridItemSpan(3) }) {
            Text("Playback", style = MaterialTheme.typography.headlineMedium)
        }
        item {
            QuickMenuAction(
                "Restart",
                Icons.Rounded.Replay,
                { player.seekTo(0) },
                firstFocusRequester
            )
        }
        item {
            QuickMenuAction(
                "Rewind 10 seconds",
                Icons.Rounded.FastRewind,
                { player.seekTo((player.currentPosition - 10_000L).coerceAtLeast(0L)) }
            )
        }
        item {
            QuickMenuAction(
                "${if (isPlaying) "Pause" else "Play"}",
                if (isPlaying) Icons.Rounded.Pause else Icons.Rounded.PlayArrow,
                { if (player.isPlaying) player.pause() else player.play() }
            )
        }
        item {
            QuickMenuAction(
                "Forward 10 seconds",
                Icons.Rounded.FastForward,
                {
                    val duration = player.duration.takeIf { it > 0L } ?: Long.MAX_VALUE
                    player.seekTo((player.currentPosition + 10_000L).coerceAtMost(duration))
                }
            )
        }
    }
}

@OptIn(ExperimentalTvMaterial3Api::class)
@Composable
private fun QuickMenuVideoPage''',
              'playback grid'
          )

          replace(
              '            Text("More player options can live here", modifier = Modifier.padding(18.dp))',
              '            Text("Coming soon!", modifier = Modifier.padding(18.dp))',
              'coming soon copy'
          )

          replace(
              '''                    colors = ClickableSurfaceDefaults.colors(
                        containerColor = if (option.media3Mode == selectedResizeMode) {
                            MaterialTheme.colorScheme.secondaryContainer
                        } else MaterialTheme.colorScheme.surfaceVariant
                    )''',
              '''                    colors = ClickableSurfaceDefaults.colors(
                        containerColor = if (option.media3Mode == selectedResizeMode) {
                            MaterialTheme.colorScheme.secondaryContainer
                        } else MaterialTheme.colorScheme.surfaceVariant,
                        focusedContainerColor = MaterialTheme.colorScheme.secondaryContainer,
                        focusedContentColor = MaterialTheme.colorScheme.onSecondaryContainer
                    )''',
              'video focused colours'
          )

          pages.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/me/xdan/aperture/ui/screen/player/QuickMenuPages.kt
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix: move Quick Menu pages to grids"
          git push
