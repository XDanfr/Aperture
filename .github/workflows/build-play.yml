name: Build Play bundle
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: |
          sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Prepare release credentials
        if: github.event_name == 'workflow_dispatch'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYTHON'
          import os, base64
          from pathlib import Path
          for key in ('TMDB_API_KEY', 'OPENSUBTITLES_API_KEY', 'PLAY_UPLOAD_KEYSTORE_BASE64'):
              if not os.environ.get(key):
                  raise SystemExit('Missing secret: ' + key)
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:').replace(' ', '\\ ')
          Path('local.properties').write_text(''.join(key + '=' + escape(os.environ[key]) + '\n' for key in ('TMDB_API_KEY', 'OPENSUBTITLES_API_KEY')))
          keyfile = Path(os.environ['RUNNER_TEMP']) / 'play-upload.jks'
          keyfile.write_bytes(base64.b64decode(os.environ['PLAY_UPLOAD_KEYSTORE_BASE64'], validate=True))
          keyfile.chmod(0o600)
          PYTHON
      - name: Test and build Play
        env:
          PLAY_UPLOAD_STORE_FILE: ${{ github.event_name == 'workflow_dispatch' && format('{0}/play-upload.jks', runner.temp) || '' }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: bash ./gradlew --max-workers=1 --no-parallel :app:testPlayDebugUnitTest :app:bundlePlayRelease :app:assemblePlayRelease :app:processStandardReleaseMainManifest :app:processCreatorReleaseMainManifest
      - name: Check merged permissions
        run: |
          python3 scripts/check_play_manifest.py
          python3 scripts/check_native_alignment.py
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/play/release/*.apk
      - name: Verify upload signature
        if: github.event_name == 'workflow_dispatch'
        run: |
          jarsigner -verify app/build/outputs/bundle/playRelease/app-play-release.aab > "$RUNNER_TEMP/play-signature.txt"
          cat "$RUNNER_TEMP/play-signature.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/play-signature.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Aperture-Play
          path: |
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/mapping/playRelease/mapping.txt
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-upload.jks"
