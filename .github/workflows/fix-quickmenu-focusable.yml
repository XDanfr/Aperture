name: Fix Quick Menu focusable import

on:
  push:
    branches:
      - feature/expressive-quick-menu

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing focusable import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/me/xdan/aperture/ui/screen/player/QuickMenuPages.kt')
          text = path.read_text()
          needle = 'import androidx.compose.foundation.layout.Arrangement\n'
          replacement = 'import androidx.compose.foundation.focusable\nimport androidx.compose.foundation.layout.Arrangement\n'
          if 'import androidx.compose.foundation.focusable\n' not in text:
              if text.count(needle) != 1:
                  raise SystemExit('layout import anchor not found exactly once')
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/me/xdan/aperture/ui/screen/player/QuickMenuPages.kt
          if ! git diff --cached --quiet; then
            git commit -m "fix: import Quick Menu focusable modifier"
          fi
          git rm .github/workflows/fix-quickmenu-focusable.yml
          git commit -m "chore: remove temporary focusable import workflow"
          git push
