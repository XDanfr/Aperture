name: Check branding build

on:
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'artwork/**'
      - 'tools/generate_brand_assets.py'
      - 'tools/check_brand_assets.py'
      - '.github/workflows/branding-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: |
          sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Build debug and run unit tests
        run: bash ./gradlew --no-daemon :app:assembleStandardDebug :app:testStandardDebugUnitTest
      - name: Check TV banner viewport
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python tools/check_brand_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: Aperture-branding-debug
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
          retention-days: 7
