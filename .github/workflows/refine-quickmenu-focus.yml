name: Refine Quick Menu Focus

on:
  push:
    branches:
      - feature/expressive-quick-menu

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Quick Menu focus and styling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/me/xdan/aperture/ui/screen/player/QuickMenuPages.kt")
          text = path.read_text()

          def replace(old: str, new: str, label: str, count: int = 1) -> None:
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{label}: expected {count}, found {actual}")
              globals()["text"] = text.replace(old, new, count)

          # Imports used by the focus boundary and centered empty states.
          replace(
              "import android.view.KeyEvent\n", "", "remove KeyEvent import"
          )
          replace(
              "import androidx.compose.ui.input.key.onPreviewKeyEvent\n", "", "remove key handler import"
          )
          replace(
              "import androidx.compose.foundation.layout.padding\n",
              "import androidx.compose.foundation.layout.PaddingValues\nimport androidx.compose.foundation.layout.padding\n",
              "PaddingValues import"
          )
          replace(
              "import androidx.compose.runtime.setValue\n",
              "import androidx.compose.runtime.setValue\nimport androidx.compose.runtime.withFrameNanos\n",
              "frame import"
          )
          replace(
              "import androidx.compose.ui.focus.focusRequester\n",
              "import androidx.compose.ui.focus.focusProperties\nimport androidx.compose.ui.focus.focusRequester\nimport androidx.compose.ui.focus.onFocusChanged\n",
              "focus imports"
          )

          # Root focus boundary and page-entry focus timing.
          replace(
              "    var page by remember { mutableStateOf<QuickMenuPage>(QuickMenuPage.Categories) }\n    val pageFocusRequester = remember { FocusRequester() }",
              "    var page by remember { mutableStateOf<QuickMenuPage>(QuickMenuPage.Categories) }\n    val pageFocusRequester = remember { FocusRequester() }\n    val closeFocusRequester = remember { FocusRequester() }",
              "close requester"
          )
          replace(
              '''    LaunchedEffect(page) {
        if (page == QuickMenuPage.Categories) {
            focusRequester.requestFocus()
        } else {
            pageFocusRequester.requestFocus()
        }
    }''',
              '''    LaunchedEffect(page) {
        withFrameNanos { }
        withFrameNanos { }
        if (page == QuickMenuPage.Categories) {
            focusRequester.requestFocus()
        } else {
            pageFocusRequester.requestFocus()
        }
    }''',
              "page focus timing"
          )
          replace(
              '''    Surface(
        modifier = Modifier
            .onPreviewKeyEvent { event ->
                if (event.nativeKeyEvent.action == KeyEvent.ACTION_DOWN &&
                    event.nativeKeyEvent.keyCode == KeyEvent.KEYCODE_DPAD_UP
                ) {
                    onClose()
                    true
                } else {
                    false
                }
            }
            .fillMaxWidth()''',
              '''    Surface(
        modifier = Modifier
            .fillMaxWidth()''',
              "remove root Up handler"
          )
          replace(
              '''    ) {
        AnimatedContent(''',
              '''    ) {
        Box(Modifier.fillMaxSize()) {
            Box(
                modifier = Modifier
                    .size(1.dp)
                    .focusRequester(closeFocusRequester)
                    .focusable()
                    .onFocusChanged { if (it.isFocused) onClose() }
            )

        AnimatedContent(''',
              "close focus target"
          )
          replace(
              '''            }
        }
    }
}''',
              '''            }
        }
        }
    }
}''',
              "close focus wrapper"
          )

          # Thread the close target through every page.
          replace(
              '''                QuickMenuPage.Categories -> QuickMenuCategories(
                    focusRequester = focusRequester,
                    onSelected = { page = it }
                )''',
              '''                QuickMenuPage.Categories -> QuickMenuCategories(
                    focusRequester = focusRequester,
                    closeFocusRequester = closeFocusRequester,
                    onSelected = { page = it }
                )''',
              "category close requester"
          )
          replace(
              '''                    firstFocusRequester = pageFocusRequester,
                    emptyLabel = "No audio tracks available."''',
              '''                    firstFocusRequester = pageFocusRequester,
                    closeFocusRequester = closeFocusRequester,
                    emptyLabel = "No audio tracks available."''',
              "audio close requester"
          )
          replace(
              '''                QuickMenuPage.Subtitles -> QuickMenuSubtitlesPage(
                    player = player,
                    firstFocusRequester = pageFocusRequester,''',
              '''                QuickMenuPage.Subtitles -> QuickMenuSubtitlesPage(
                    player = player,
                    firstFocusRequester = pageFocusRequester,
                    closeFocusRequester = closeFocusRequester,''',
              "subtitle close requester"
          )
          replace(
              '''                QuickMenuPage.Playback -> QuickMenuPlaybackPage(
                    player = player,
                    firstFocusRequester = pageFocusRequester
                )''',
              '''                QuickMenuPage.Playback -> QuickMenuPlaybackPage(
                    player = player,
                    firstFocusRequester = pageFocusRequester,
                    closeFocusRequester = closeFocusRequester
                )''',
              "playback close requester"
          )
          replace(
              '''                QuickMenuPage.Video -> QuickMenuVideoPage(
                    selectedResizeMode = videoResizeMode,
                    firstFocusRequester = pageFocusRequester,
                    onSelected = onVideoResizeModeSelected
                )''',
              '''                QuickMenuPage.Video -> QuickMenuVideoPage(
                    selectedResizeMode = videoResizeMode,
                    firstFocusRequester = pageFocusRequester,
                    closeFocusRequester = closeFocusRequester,
                    onSelected = onVideoResizeModeSelected
                )''',
              "video close requester"
          )
          replace(
              "                QuickMenuPage.Other -> QuickMenuOtherPage(firstFocusRequester = pageFocusRequester)",
              "                QuickMenuPage.Other -> QuickMenuOtherPage(firstFocusRequester = pageFocusRequester, closeFocusRequester = closeFocusRequester)",
              "other close requester"
          )

          # Categories are one row, so Up from any category card closes the menu.
          replace(
              '''private fun QuickMenuCategories(
    focusRequester: FocusRequester,
    onSelected: (QuickMenuPage) -> Unit
) {''',
              '''private fun QuickMenuCategories(
    focusRequester: FocusRequester,
    closeFocusRequester: FocusRequester,
    onSelected: (QuickMenuPage) -> Unit
) {''',
              "category signature"
          )
          replace(
              '''                    modifier = Modifier
                        .weight(1f)
                        .then(if (index == 0) Modifier.focusRequester(focusRequester) else Modifier),''',
              '''                    modifier = Modifier
                        .weight(1f)
                        .then(if (index == 0) Modifier.focusRequester(focusRequester) else Modifier)
                        .focusProperties { up = closeFocusRequester },''',
              "category Up boundary"
          )

          # Track grid: leave the normal grid alone below the first row.
          replace(
              '''    firstFocusRequester: FocusRequester,
    emptyLabel: String,
    headerContent: (@Composable () -> Unit)? = null
) {''',
              '''    firstFocusRequester: FocusRequester,
    closeFocusRequester: FocusRequester? = null,
    emptyLabel: String,
    headerContent: (@Composable () -> Unit)? = null
) {''',
              "track page signature"
          )
          replace(
              '''        if (items.isEmpty()) {
            Text(
                emptyLabel,
                color = MaterialTheme.colorScheme.onSurfaceVariant,
                style = MaterialTheme.typography.bodyLarge
            )
            return
        }''',
              '''        if (items.isEmpty()) {
            Box(
                modifier = Modifier.fillMaxSize(),
                contentAlignment = Alignment.Center
            ) {
                Text(
                    emptyLabel,
                    color = MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.72f),
                    style = MaterialTheme.typography.bodyLarge
                )
            }
            return
        }''',
              "track empty state"
          )
          replace(
              '''        LazyVerticalGrid(
            columns = GridCells.Fixed(3),
            modifier = Modifier
                .fillMaxSize()
                .padding(horizontal = 8.dp),
            verticalArrangement = Arrangement.spacedBy(12.dp),
            horizontalArrangement = Arrangement.spacedBy(12.dp)
        ) {''',
              '''        LazyVerticalGrid(
            columns = GridCells.Fixed(3),
            modifier = Modifier
                .fillMaxSize()
                .padding(horizontal = 8.dp),
            contentPadding = PaddingValues(vertical = 14.dp, horizontal = 4.dp),
            verticalArrangement = Arrangement.spacedBy(12.dp),
            horizontalArrangement = Arrangement.spacedBy(12.dp)
        ) {''',
              "track grid padding"
          )
          replace(
              '''                    modifier = Modifier.then(
                        if (item == items.firstOrNull()) {
                            Modifier.focusRequester(firstFocusRequester)
                        } else {
                            Modifier
                        }
                    ),''',
              '''                    modifier = Modifier
                        .then(if (item == items.firstOrNull()) Modifier.focusRequester(firstFocusRequester) else Modifier)
                        .focusProperties {
                            if (items.indexOf(item) < 3 && closeFocusRequester != null) {
                                up = closeFocusRequester
                            }
                        },''',
              "track Up boundary"
          )
          replace(
              '''                    colors = ClickableSurfaceDefaults.colors(
                        containerColor = if (item.isSelected) {
                            MaterialTheme.colorScheme.secondaryContainer
                        } else {
                            MaterialTheme.colorScheme.surfaceVariant
                        }
                    )''',
              '''                    colors = ClickableSurfaceDefaults.colors(
                        containerColor = if (item.isSelected) {
                            MaterialTheme.colorScheme.secondaryContainer
                        } else {
                            MaterialTheme.colorScheme.surfaceVariant
                        },
                        focusedContainerColor = MaterialTheme.colorScheme.primary,
                        focusedContentColor = MaterialTheme.colorScheme.onPrimary,
                        pressedContainerColor = MaterialTheme.colorScheme.primary,
                        pressedContentColor = MaterialTheme.colorScheme.onPrimary
                    )''',
              "track focus colour"
          )

          # Timing controls use the same OSD focus colour and close from the top.
          replace(
              '''    focusRequester: FocusRequester,
    onDecrease: () -> Unit,''',
              '''    focusRequester: FocusRequester,
    closeFocusRequester: FocusRequester? = null,
    onDecrease: () -> Unit,''',
              "timing signature"
          )
          replace(
              '''                modifier = Modifier
                    .height(40.dp)
                    .focusRequester(focusRequester),''',
              '''                modifier = Modifier
                    .height(40.dp)
                    .focusRequester(focusRequester)
                    .focusProperties { if (closeFocusRequester != null) up = closeFocusRequester },''',
              "timing Up boundary"
          )
          replace(
              '''                colors = ClickableSurfaceDefaults.colors(
                    containerColor = MaterialTheme.colorScheme.surfaceVariant
                )''',
              '''                colors = ClickableSurfaceDefaults.colors(
                    containerColor = MaterialTheme.colorScheme.surfaceVariant,
                    focusedContainerColor = MaterialTheme.colorScheme.primary,
                    focusedContentColor = MaterialTheme.colorScheme.onPrimary,
                    pressedContainerColor = MaterialTheme.colorScheme.primary,
                    pressedContentColor = MaterialTheme.colorScheme.onPrimary
                )''',
              "timing minus focus colour",
              1
          )
          replace(
              '''                colors = ClickableSurfaceDefaults.colors(
                    containerColor = MaterialTheme.colorScheme.surfaceVariant
                )''',
              '''                colors = ClickableSurfaceDefaults.colors(
                    containerColor = MaterialTheme.colorScheme.surfaceVariant,
                    focusedContainerColor = MaterialTheme.colorScheme.primary,
                    focusedContentColor = MaterialTheme.colorScheme.onPrimary,
                    pressedContainerColor = MaterialTheme.colorScheme.primary,
                    pressedContentColor = MaterialTheme.colorScheme.onPrimary
                )''',
              "timing value focus colour",
              1
          )
          replace(
              '''                colors = ClickableSurfaceDefaults.colors(
                    containerColor = MaterialTheme.colorScheme.surfaceVariant
                )''',
              '''                colors = ClickableSurfaceDefaults.colors(
                    containerColor = MaterialTheme.colorScheme.surfaceVariant,
                    focusedContainerColor = MaterialTheme.colorScheme.primary,
                    focusedContentColor = MaterialTheme.colorScheme.onPrimary,
                    pressedContainerColor = MaterialTheme.colorScheme.primary,
                    pressedContentColor = MaterialTheme.colorScheme.onPrimary
                )''',
              "timing plus focus colour",
              1
          )

          replace(
              '''private fun QuickMenuSubtitlesPage(
    player: androidx.media3.common.Player,
    firstFocusRequester: FocusRequester,
    subtitleDelayMs: Long,''',
              '''private fun QuickMenuSubtitlesPage(
    player: androidx.media3.common.Player,
    firstFocusRequester: FocusRequester,
    closeFocusRequester: FocusRequester,
    subtitleDelayMs: Long,''',
              "subtitle signature"
          )
          replace(
              '''                onReset = onSubtitleDelayReset,
                focusRequester = firstFocusRequester
            )''',
              '''                onReset = onSubtitleDelayReset,
                focusRequester = firstFocusRequester,
                closeFocusRequester = closeFocusRequester
            )''',
              "subtitle timing Up boundary"
          )
          replace(
              '''        firstFocusRequester = trackFocusRequester,
        emptyLabel = "No subtitle tracks available.",''',
              '''        firstFocusRequester = trackFocusRequester,
        closeFocusRequester = closeFocusRequester,
        emptyLabel = "No subtitle tracks available.",''',
              "subtitle track close boundary"
          )

          # Playback is naturally a 2x2 grid. Only the top row closes on Up.
          replace(
              '''private fun QuickMenuPlaybackPage(
    player: androidx.media3.common.Player,
    firstFocusRequester: FocusRequester
) {''',
              '''private fun QuickMenuPlaybackPage(
    player: androidx.media3.common.Player,
    firstFocusRequester: FocusRequester,
    closeFocusRequester: FocusRequester
) {''',
              "playback signature"
          )
          replace(
              '''    LazyVerticalGrid(
        columns = GridCells.Fixed(3),''',
              '''    LazyVerticalGrid(
        columns = GridCells.Fixed(2),''',
              "playback columns"
          )
          replace(
              '''        item(span = { GridItemSpan(3) }) {''',
              '''        item(span = { GridItemSpan(2) }) {''',
              "playback title span"
          )
          replace(
              '''                { player.seekTo(0) },
                firstFocusRequester
            )''',
              '''                { player.seekTo(0) },
                firstFocusRequester,
                true,
                closeFocusRequester
            )''',
              "restart action"
          )
          replace(
              '''                { player.seekTo((player.currentPosition - 10_000L).coerceAtLeast(0L)) }
            )''',
              '''                { player.seekTo((player.currentPosition - 10_000L).coerceAtLeast(0L)) },
                null,
                true,
                closeFocusRequester
            )''',
              "rewind action"
          )
          replace(
              '''                { if (player.isPlaying) player.pause() else player.play() }
            )''',
              '''                { if (player.isPlaying) player.pause() else player.play() },
                null,
                false,
                closeFocusRequester
            )''',
              "play action"
          )
          replace(
              '''                    player.seekTo((player.currentPosition + 10_000L).coerceAtMost(duration))
                }
            )''',
              '''                    player.seekTo((player.currentPosition + 10_000L).coerceAtMost(duration))
                },
                null,
                false,
                closeFocusRequester
            )''',
              "forward action"
          )

          # Video has one row, so Up can always close from its options.
          replace(
              '''private fun QuickMenuVideoPage(
    selectedResizeMode: Int,
    firstFocusRequester: FocusRequester,
    onSelected: (Int) -> Unit
) {''',
              '''private fun QuickMenuVideoPage(
    selectedResizeMode: Int,
    firstFocusRequester: FocusRequester,
    closeFocusRequester: FocusRequester,
    onSelected: (Int) -> Unit
) {''',
              "video signature"
          )
          replace(
              '''                    modifier = Modifier
                        .weight(1f)
                        .then(if (index == 0) Modifier.focusRequester(firstFocusRequester) else Modifier),''',
              '''                    modifier = Modifier
                        .weight(1f)
                        .then(if (index == 0) Modifier.focusRequester(firstFocusRequester) else Modifier)
                        .focusProperties { up = closeFocusRequester },''',
              "video Up boundary"
          )
          replace(
              '''                    colors = ClickableSurfaceDefaults.colors(
                        containerColor = if (option.media3Mode == selectedResizeMode) {
                            MaterialTheme.colorScheme.secondaryContainer
                        } else MaterialTheme.colorScheme.surfaceVariant,
                        focusedContainerColor = MaterialTheme.colorScheme.secondaryContainer,
                        focusedContentColor = MaterialTheme.colorScheme.onSecondaryContainer
                    )''',
              '''                    colors = ClickableSurfaceDefaults.colors(
                        containerColor = if (option.media3Mode == selectedResizeMode) {
                            MaterialTheme.colorScheme.secondaryContainer
                        } else MaterialTheme.colorScheme.surfaceVariant,
                        focusedContainerColor = MaterialTheme.colorScheme.primary,
                        focusedContentColor = MaterialTheme.colorScheme.onPrimary,
                        pressedContainerColor = MaterialTheme.colorScheme.primary,
                        pressedContentColor = MaterialTheme.colorScheme.onPrimary
                    )''',
              "video focus colour"
          )
          replace(
              '''                        Text(
                            option.description,
                            color = MaterialTheme.colorScheme.onSecondaryContainer
                        )''',
              '''                        Text(
                            option.description,
                            color = MaterialTheme.colorScheme.onPrimary
                        )''',
              "video focused description"
          )

          # Other is informational, not interactive.
          replace(
              '''private fun QuickMenuOtherPage(firstFocusRequester: FocusRequester) {''',
              '''private fun QuickMenuOtherPage(
    firstFocusRequester: FocusRequester,
    closeFocusRequester: FocusRequester
) {''',
              "other signature"
          )
          replace(
              '''        Text("Other", style = MaterialTheme.typography.headlineMedium)
        Surface(
            onClick = {},
            modifier = Modifier.fillMaxWidth().focusRequester(firstFocusRequester),
            shape = ClickableSurfaceDefaults.shape(RoundedCornerShape(18.dp)),
            colors = ClickableSurfaceDefaults.colors(containerColor = MaterialTheme.colorScheme.surfaceVariant)
        ) {
            Text("More player options can live here", modifier = Modifier.padding(18.dp))
        }''',
              '''        Text("Other", style = MaterialTheme.typography.headlineMedium)
        Box(
            modifier = Modifier
                .fillMaxSize()
                .focusRequester(firstFocusRequester)
                .focusable()
                .focusProperties { up = closeFocusRequester },
            contentAlignment = Alignment.Center
        ) {
            Text(
                "Coming soon!",
                style = MaterialTheme.typography.bodyLarge,
                color = MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.72f)
            )
        }''',
              "other empty state"
          )

          # Generic playback action focus boundary and consistent OSD colours.
          replace(
              '''private fun QuickMenuAction(
    label: String,
    icon: androidx.compose.ui.graphics.vector.ImageVector,
    onClick: () -> Unit,
    focusRequester: FocusRequester? = null
) {''',
              '''private fun QuickMenuAction(
    label: String,
    icon: androidx.compose.ui.graphics.vector.ImageVector,
    onClick: () -> Unit,
    focusRequester: FocusRequester? = null,
    closeOnUp: Boolean = false,
    closeFocusRequester: FocusRequester? = null
) {''',
              "action signature"
          )
          replace(
              '''            .fillMaxWidth()
            .then(if (focusRequester != null) Modifier.focusRequester(focusRequester) else Modifier),''',
              '''            .fillMaxWidth()
            .then(if (focusRequester != null) Modifier.focusRequester(focusRequester) else Modifier)
            .focusProperties {
                if (closeOnUp && closeFocusRequester != null) up = closeFocusRequester
            },''',
              "action focus boundary"
          )
          replace(
              '''        colors = ClickableSurfaceDefaults.colors(containerColor = MaterialTheme.colorScheme.surfaceVariant)''',
              '''        colors = ClickableSurfaceDefaults.colors(
            containerColor = MaterialTheme.colorScheme.surfaceVariant,
            focusedContainerColor = MaterialTheme.colorScheme.primary,
            focusedContentColor = MaterialTheme.colorScheme.onPrimary,
            pressedContainerColor = MaterialTheme.colorScheme.primary,
            pressedContentColor = MaterialTheme.colorScheme.onPrimary
        )''',
              "action focus colour"
          )

          path.write_text(text)
          PY

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/me/xdan/aperture/ui/screen/player/QuickMenuPages.kt
          git rm .github/workflows/refine-quickmenu-focus.yml
          git commit -m "fix: refine Quick Menu focus and styling"
          git push