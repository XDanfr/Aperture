  <title id="title">Aperture — Expressive</title>
  <desc id="desc">Six equal rounded shutter blades in Aperture Purple Inverse Primary #6750A4, with opaque On Primary #381E72 intersections and a foreground Primary #D0BCFF play symbol. The repeated flat intersections describe an interwoven ring rather than an opaque stack. Transparent background. Geometry preserved from the approved icon.</desc>
